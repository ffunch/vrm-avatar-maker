<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRM Seat Test</title>
<style>
  :root { --bg: #2b2b2b; --fg: #eee; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; display: flex; gap: 12px; align-items: center; background: #0008; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.1/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<div id="bar">
  <input type="file" id="file" accept=".vrm,.glb">
  <label><input type="radio" name="pose" value="seated" checked> Seated (So Many Rooms)</label>
  <label><input type="radio" name="pose" value="rest"> Rest</label>
  <select id="expr"><option value="">(no expression)</option></select>
  <label><input type="checkbox" id="live"> Blink and talk</label>
  <label><input type="checkbox" id="look" checked> Eyes follow camera</label>
  <label><input type="checkbox" id="turn"> Turn head</label>
  <span id="status"></span>
</div>
<script type="module">
// Loads a VRM the way So Many Rooms' VR Circle does and
// applies the same SEATED_POSE, so we can see whether our avatars sit properly.
// Usage: serve the repo root, open /tools/viewer/?src=/out/x.vrm (or pick a file).
// Extra params: face=1 (close-up), expr=<expression name>, live=1 (blink and talk), turn=1 (head turns
// side to side, to see the hair spring bones swing), look=0 (eyes don't follow the camera).
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

const SEATED_POSE = {
  leftUpperLeg: [-Math.PI / 2, 0, 0], rightUpperLeg: [-Math.PI / 2, 0, 0],
  leftLowerLeg: [Math.PI / 2, 0, 0], rightLowerLeg: [Math.PI / 2, 0, 0],
  leftUpperArm: [0, 0, -1.25], rightUpperArm: [0, 0, 1.25],
};

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2b2b);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(1, 3, 2); scene.add(sun);
scene.add(new THREE.GridHelper(4, 8, 0x666666, 0x444444));
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
camera.position.set(1.6, 1.3, 2.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.update();

let vrm = null, figure = null, bytes = null;
const params = new URLSearchParams(location.search);
const exprSelect = document.getElementById("expr");
const live = document.getElementById("live");
if (params.get("live")) live.checked = true;
const look = document.getElementById("look"), turn = document.getElementById("turn");
if (params.get("turn")) turn.checked = true;
if (params.get("look") === "0") look.checked = false;
if (params.get("face")) { camera.position.set(0.35, 1.25, 0.75); controls.target.set(0, 1.12, 0); controls.update(); }
const status = document.getElementById("status");
const at = (bone) => vrm.humanoid.getRawBoneNode(bone)?.getWorldPosition(new THREE.Vector3()) ?? null;

async function show(buffer) {
  bytes = buffer;
  if (figure) { scene.remove(figure); VRMUtils.deepDispose(figure); }
  const loader = new GLTFLoader();
  loader.register((parser) => new VRMLoaderPlugin(parser));
  const gltf = await loader.parseAsync(buffer.slice(0), "");
  vrm = gltf.userData.vrm;
  if (!vrm) { status.textContent = "No VRM in the file."; return; }
  VRMUtils.removeUnnecessaryVertices(vrm.scene);
  VRMUtils.combineSkeletons(vrm.scene);
  VRMUtils.rotateVRM0(vrm);
  vrm.scene.traverse((o) => { o.frustumCulled = false; });
  const seated = document.querySelector("input[name=pose]:checked").value === "seated";
  if (seated) for (const [bone, [x, y, z]] of Object.entries(SEATED_POSE)) {
    vrm.humanoid.getNormalizedBoneNode(bone)?.rotation.set(x, y, z);
  }
  vrm.update(0);
  vrm.scene.updateMatrixWorld(true);
  const feet = [at("leftFoot"), at("rightFoot")].filter(Boolean);
  const floor = feet.length ? Math.min(...feet.map((p) => p.y)) : 0;
  const thigh = at("leftUpperLeg") ?? at("hips");
  figure = new THREE.Group();
  vrm.scene.position.y = -floor;
  figure.add(vrm.scene);
  if (seated) {
    const h = Math.max(0.2, (thigh ? thigh.y - floor : 0.45) - 0.07);
    const stool = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, h, 20), new THREE.MeshStandardMaterial({ color: 0x5a4632 }));
    stool.position.set(0, h / 2, (thigh ? thigh.z : 0) + 0.1);
    figure.add(stool);
  }
  scene.add(figure);
  const names = Object.keys(vrm.expressionManager?.expressionMap ?? {});
  exprSelect.innerHTML = '<option value="">(no expression)</option>' + names.map((n) => `<option>${n}</option>`).join("");
  if (params.get("expr")) exprSelect.value = params.get("expr");
  if (vrm.lookAt) vrm.lookAt.target = camera;
  const springs = vrm.springBoneManager?.joints?.size ?? 0;
  status.textContent = `${vrm.meta?.name ?? ""} (VRM ${vrm.meta?.metaVersion ?? "?"}) · look-at: ${vrm.lookAt ? "yes" : "no"} · spring joints: ${springs}`;
  window.viewerReady = true;
  window.viewer = { camera, controls, vrm, scene };  // for scripted checks
}

document.getElementById("file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (f) show(await f.arrayBuffer());
});
document.querySelectorAll("input[name=pose]").forEach((r) => r.addEventListener("change", () => bytes && show(bytes)));
const src = new URLSearchParams(location.search).get("src");
if (src) fetch(src).then((r) => r.arrayBuffer()).then(show).catch((err) => { status.textContent = String(err); });

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
let t = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;  // one getDelta per frame: the spring bones need the real step
  const em = vrm?.expressionManager;
  if (em) {
    for (const name of Object.keys(em.expressionMap)) em.setValue(name, 0);
    if (exprSelect.value) em.setValue(exprSelect.value, 1);
    if (live.checked) {
      em.setValue("blink", t % 3.5 < 0.15 ? 1 : 0);                           // blink every 3.5 s
      const mouth = ["aa", "oh", "ee", "ou", "ih"][Math.floor(t * 6) % 5];     // babble
      em.setValue(mouth, 0.5 + 0.5 * Math.abs(Math.sin(t * 9)));
    }
    if (vrm.lookAt) vrm.lookAt.autoUpdate = look.checked, vrm.lookAt.target = look.checked ? camera : null;
    if (!look.checked && vrm.lookAt) vrm.lookAt.reset();
    const neck = vrm.humanoid.getNormalizedBoneNode("head");
    if (neck) neck.rotation.y = turn.checked ? 0.6 * Math.sin(t * 2.2) : 0;
    vrm.update(dt);
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
